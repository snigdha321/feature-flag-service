# DigitalOcean App Platform spec — source of truth for deployments.
#
# Applied by .github/workflows/deploy-app-platform.yml via the official
# digitalocean/app_action/deploy@v2 action. The action expands environment
# placeholders (dollar-brace syntax) from the workflow environment before
# applying, and upserts the app by `name` below (creates if missing, updates if
# it exists — no app ID needed).
#
# Placeholders filled at deploy time:
#   DOCR_REGISTRY  -> DOCR registry name (repo variable DOCR_REGISTRY)
#   IMAGE_TAG      -> image tag being deployed (workflow input)
#
# NOTE: this file is authoritative — changes made in the DO dashboard (envs,
# scaling, etc.) are overwritten on the next deploy, so manage them here.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: feature-flag-service
      match:
        authority:
          exact: ""
        path:
          prefix: /
name: do-test
region: blr
services:
  - name: feature-flag-service
    envs:
      - key: APP_VERSION
        scope: RUN_AND_BUILD_TIME
        value: ${IMAGE_TAG}
    http_port: 8000
    image:
      registry: ${DOCR_REGISTRY}
      registry_type: DOCR
      repository: feature-flag-service
      tag: ${IMAGE_TAG}
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb