# DigitalOcean App Platform spec — source of truth for deployments.
#
# Applied by .github/workflows/deploy-app-platform.yml via the official
# digitalocean/app_action/deploy@v2 action. The action expands environment
# placeholders (dollar-brace syntax) from the workflow environment before
# applying, and upserts the app by `name` below (creates if missing, updates if
# it exists — no app ID needed).
#
# Placeholders filled at deploy time:
#   DOCR_REGISTRY_2  -> DOCR registry name (repo variable DOCR_REGISTRY_2)
#   IMAGE_TAG      -> image tag being deployed (workflow input)
#
# NOTE: this file is authoritative — changes made in the DO dashboard (envs,
# scaling, etc.) are overwritten on the next deploy, so manage them here.
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
envs:
- key: DATABASE_URL
  scope: RUN_AND_BUILD_TIME
  type: SECRET
  value: EV[1:uCGloLV84zywNGpINgKoapzBv5okqTiF:L483I8i3sjjQenGBTvDT+zGN1ZyXF1AdU8b1sbosqQ60nQ/ckF1OuNgsPsG+WIdecgbteWmTOTSkNgy+4fai5ZO5WtaIW20yfhNkQVkt6uTpFXGggprym3JWVnsrii18imLa3Ylye/F/QewOahTdA1K48FvmuB1KtDVoocOcsG3r27KGPQ7tpS+tBzf1mDesdD8MnQBv2Wk=]
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: feature-flag-service
      match:
        # Match all hosts. DO ingress only supports *exact* authority matching,
        # so an empty/incorrect authority silently drops all external traffic
        # (only the platform's direct /health probe reached the container).
        # Omitting `authority` routes every host on this path prefix.
        path:
          prefix: /
name: feature-flag-app
region: blr
services:
  - name: feature-flag-service
    envs:
      - key: APP_VERSION
        scope: RUN_AND_BUILD_TIME
        value: ${IMAGE_TAG}
    http_port: 8000
    # HTTP readiness check against the app's liveness endpoint (does not touch
    # the database), on the same port the platform routes to.
    health_check:
      http_path: /health
      port: 8000
    image:
      registry: ${DOCR_REGISTRY_2}
      registry_type: DOCR
      repository: feature-flag-service
      tag: ${IMAGE_TAG}
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb