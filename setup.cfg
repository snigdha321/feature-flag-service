[tool:pytest]
asyncio_mode = auto
testpaths = tests
addopts = -q --cov=app --cov-report=term-missing
markers =
    smoke: end-to-end checks against a running server (auto-skips if none reachable)

[mypy]
python_version = 3.11
plugins = pydantic.mypy
ignore_missing_imports = True
disallow_untyped_defs = False
warn_unused_ignores = True
